name: Deploy

on:
  # After CI of a push to main has finished (both workflows filter by paths,
  # so a merge triggers one or both of them).
  workflow_run:
    workflows: [ Backend, Frontend ]
    types: [ completed ]
    branches: [ main ]
  # Manual run (Actions → Deploy → Run workflow): for changes outside
  # backend/ and frontend/, e.g. docker-compose.prod.yaml.
  workflow_dispatch:

# One deploy at a time; a second one waits instead of running in parallel.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only green CI of a push (not of a pull request), or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server runs deploy.sh for this key whatever command is sent
      # (forced command in authorized_keys).
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: >-
          ssh -i ~/.ssh/deploy_key
          -o IdentitiesOnly=yes
          -o ServerAliveInterval=60
          "$EC2_USER@$EC2_HOST"
