<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Activate your account</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; line-height: 1.5;">
<h2>Welcome to Online Cinema!</h2>
<p>Thanks for signing up. Please confirm your email address to activate your account.</p>
<p>
    <a href="{{ activation_link }}"
       style="display: inline-block; padding: 10px 20px; background: #e50914;
                color: #fff; text-decoration: none; border-radius: 4px;">
        Activate account
    </a>
</p>
<p>Or copy this link into your browser:<br>{{ activation_link }}</p>
<p>The link is valid for {{ expire_hours }} hours.</p>
<p style="color: #888; font-size: 12px;">
    If you didn't create an account, just ignore this email.
</p>
</body>
</html>
